# Railway service config for apps/cms (Payload).
# Set service Root Directory to repo root (/) so npm workspaces resolve.
# Attach Railway Postgres and set DATABASE_URL=${{Postgres.DATABASE_URL}}.
# SQLite (file:) is local-only — do not use on Railway.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build -w @cpa/cms"

[deploy]
startCommand = "npm run start -w @cpa/cms"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
